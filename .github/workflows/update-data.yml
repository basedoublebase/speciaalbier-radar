name: Prijzen verversen

on:
  schedule:
    - cron: "0 6 * * *"   # elke dag om 06:00 UTC
  workflow_dispatch:       # handmatig starten via het Actions-tabblad

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prijsdata bouwen
        run: python3 scripts/build_data.py
      - name: Committen als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beers.json data/abv_cache.json
          git diff --cached --quiet || git commit -m "Prijzen bijgewerkt $(date -u +%Y-%m-%d)"
          git push
